{% extends "base.html" %}{% block content %}
<section><div class="wrap narrow"><div class="card"><h2>Log in</h2>
{% if request.GET.timeout %}<div class="msg" role="status">You were logged out after 3 minutes of no activity. Please log in again.</div>{% endif %}
<form method="post">{% csrf_token %}{{ form.as_p }}<input type="hidden" name="next" value="{{ next }}"><button class="btn">Log in</button></form>
<p style="margin-top:16px">New customer? <a href="{% url 'register' %}">Create an account</a></p></div></div></section>
{% endblock %}
